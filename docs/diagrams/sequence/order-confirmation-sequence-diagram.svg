th="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="462.6" y="324.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="462.6" dy="0">3. GET /orders/me</tspan></text><line x1="452.6" y1="333.0" x2="829.4" y2="333.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="462.6" y="361.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="462.6" dy="0">4. danh sách đơn → tìm mã theo id</tspan></text><line x1="829.4" y1="370.0" x2="452.6" y2="370.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><rect x="39.0" y="282.0" width="1218.2" height="108.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M39.0,282.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="46.0" y="296.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="46.0" dy="0">opt</tspan></text><text x="95.0" y="297.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="95.0" dy="0">[đường dẫn là id, không phải mã BL-...]</tspan></text><text x="462.6" y="412.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="462.6" dy="0">5. GET /orders/:code</tspan></text><line x1="452.6" y1="421.0" x2="829.4" y2="421.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="839.4" y="449.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="839.4" dy="0">6. Đọc order + items + topping + payment SUCCESS</tspan></text><line x1="829.4" y1="458.0" x2="1206.2" y2="458.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="839.4" y="486.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="839.4" dy="0">7. order</tspan></text><line x1="1206.2" y1="495.0" x2="829.4" y2="495.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="462.6" y="557.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="462.6" dy="0">8. 404 ORDER_NOT_FOUND</tspan></text><line x1="829.4" y1="566.0" x2="452.6" y2="566.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="594.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">9. &quot;Không tìm thấy đơn hàng&quot;</tspan></text><line x1="452.6" y1="603.0" x2="90.0" y2="603.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="462.6" y="661.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="462.6" dy="0">10. 200 {code, status, subtotal, discountAmount,</tspan><tspan x="462.6" dy="17">total, items, payment.loyaltyPointsEarned}</tspan></text><line x1="829.4" y1="687.0" x2="452.6" y2="687.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="715.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">11. Mã đơn, trạng thái, giảm giá, tổng tiền,</tspan><tspan x="100.0" dy="17">+N điểm thưởng; nút Về trang chủ / Xem lịch sử</tspan></text><line x1="452.6" y1="741.0" x2="90.0" y2="741.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><rect x="39.0" y="515.0" width="1218.2" height="246.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M39.0,515.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="46.0" y="529.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="46.0" dy="0">alt</tspan></text><text x="95.0" y="530.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="95.0" dy="0">[không có đơn hoặc không phải đơn của mình]</tspan></text><line x1="39.0" y1="621.0" x2="1257.2" y2="621.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="49.0" y="637.0" font-siz