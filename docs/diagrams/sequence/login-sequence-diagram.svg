<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1090" viewBox="0 0 1420 1090" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#002C22"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#002C22" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="710.0" y="28" font-size="16" font-weight="bold" fill="#002C22" text-anchor="middle">BrewLite – Đăng nhập</text><line x1="90.0" y1="116.0" x2="90.0" y2="1000.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.0" cy="55.0" r="7"/><line x1="90.0" y1="62.0" x2="90.0" y2="78.0"/><line x1="79.0" y1="67.0" x2="101.0" y2="67.0"/><line x1="90.0" y1="78.0" x2="81.0" y2="90.0"/><line x1="90.0" y1="78.0" x2="99.0" y2="90.0"/></g><text x="90.0" y="106.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Khách hàng</text><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.0" cy="1009.0" r="7"/><line x1="90.0" y1="1016.0" x2="90.0" y2="1032.0"/><line x1="79.0" y1="1021.0" x2="101.0" y2="1021.0"/><line x1="90.0" y1="1032.0" x2="81.0" y2="1044.0"/><line x1="90.0" y1="1032.0" x2="99.0" y2="1044.0"/></g><text x="90.0" y="1060.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Khách hàng</text><line x1="481.0" y1="116.0" x2="481.0" y2="1000.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="420.9" y="61.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="481.0" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><rect x="420.9" y="1015.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="481.0" y="1035.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><line x1="843.6" y1="116.0" x2="843.6" y2="1000.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="779.9" y="53.0" width="127.4" height="56.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="843.6" y="73.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Zustand store</text><text x="843.6" y="90.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">(localStorage)</text><rect x="779.9" y="1007.0" width="127.4" height="56.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="843.6" y="1027.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Zustand store</text><text x="843.6" y="1044.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">(localStorage)</text><line x1="993.9" y1="116.0" x2="993.9" y2="1000.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="937.3" y="61.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="993.9" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><rect x="937.3" y="1015.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="993.9" y="1035.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><line x1="1335.0" y1="116.0" x2="1335.0" y2="1000.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><path d="M1280.0,67.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1335.0" cy="67.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1335.0" y="86.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><path d="M1280.0,1021.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1335.0" cy="1021.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1335.0" y="1040.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><text x="100.0" y="152.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">1. Nhập email (hoặc tên) + mật khẩu</tspan><tspan x="100.0" dy="17">bấm &quot;Đăng nhập&quot;</tspan></text><line x1="90.0" y1="178.0" x2="481.0" y2="178.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="515.0" y="210.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="515.0" dy="0">2. Hiện màn hình &quot;Đang đăng nhập...&quot;</tspan></text><path d="M481.0,200.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="491.0" y="248.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="491.0" dy="0">3. POST /auth/login {email, password}</tspan></text><line x1="481.0" y1="257.0" x2="993.9" y2="257.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="1003.9" y="285.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="1003.9" dy="0">4. Tìm user theo email hoặc tên</tspan><tspan x="1003.9" dy="17">(&quot;admin&quot; → admin@brewlite.vn)</tspan></text><line x1="993.9" y1="311.0" x2="1335.0" y2="311.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="1003.9" y="339.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="1003.9" dy="0">5. user | null</tspan></text><line x1="1335.0" y1="348.0" x2="993.9" y2="348.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1027.9" y="380.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="1027.9" dy="0">6. bcrypt.compare(password, passwordHash)</tspan></text><path d="M993.9,370.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="491.0" y="452.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="491.0" dy="0">7. 401 AUTH_INVALID</tspan></text><line x1="993.9" y1="461.0" x2="481.0" y2="461.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="489.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">8. &quot;Email hoặc mật khẩu không đúng.&quot;</tspan></text><line x1="481.0" y1="498.0" x2="90.0" y2="498.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="491.0" y="556.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="491.0" dy="0">9. 403 ACCOUNT_BLOCKED</tspan></text><line x1="993.9" y1="565.0" x2="481.0" y2="565.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="593.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">10. &quot;Tài khoản của bạn đã bị khoá...&quot;</tspan></text><line x1="481.0" y1="602.0" x2="90.0" y2="602.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1027.9" y="664.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="1027.9" dy="0">11. Ký JWT {sub, email, role}</tspan><tspan x="1027.9" dy="17">(hết hạn theo JWT_EXPIRES_IN)</tspan></text><path d="M993.9,654.0 h26 v35.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="491.0" y="713.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="491.0" dy="0">12. 200 {accessToken, expiresIn, user}</tspan></text><line x1="993.9" y1="722.0" x2="481.0" y2="722.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="491.0" y="750.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="491.0" dy="0">13. setAuth: lưu brewlite_token, brewlite_user</tspan></text><line x1="481.0" y1="759.0" x2="843.6" y2="759.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><rect x="45.0" y="779.0" width="1335.0" height="29.0" rx="3" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1"/><text x="55.0" y="795.0" font-size="13" fill="#713F12" font-weight="normal" text-anchor="start"><tspan x="55.0" dy="0">CartSync thấy có userId mới → tải giỏ hàng từ server (xem cart-sync-sequence-diagram)</tspan></text><text x="100.0" y="864.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">14. Chuyển tới /admin</tspan></text><line x1="481.0" y1="873.0" x2="90.0" y2="873.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="931.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">15. Chuyển tới trang redirect an toàn (mặc định /)</tspan></text><line x1="481.0" y1="940.0" x2="90.0" y2="940.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><rect x="39.0" y="822.0" width="1347.0" height="138.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M39.0,822.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="46.0" y="836.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="46.0" dy="0">alt</tspan></text><text x="95.0" y="837.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="95.0" dy="0">[role = ADMIN]</tspan></text><line x1="39.0" y1="891.0" x2="1386.0" y2="891.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="49.0" y="907.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="49.0" dy="0">[khách hàng]</tspan></text><rect x="29.0" y="410.0" width="1367.0" height="564.0" fill=