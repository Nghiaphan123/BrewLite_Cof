<svg xmlns="http://www.w3.org/2000/svg" width="1079" height="1076" viewBox="0 0 1079 1076" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#002C22"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#002C22" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="539.5" y="28" font-size="16" font-weight="bold" fill="#002C22" text-anchor="middle">BrewLite – Đồng bộ giỏ hàng với server</text><line x1="90.2" y1="96.0" x2="90.2" y2="1006.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="30.0" y="51.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="90.2" y="71.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><rect x="30.0" y="1011.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="90.2" y="1031.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><line x1="474.0" y1="96.0" x2="474.0" y2="1006.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="410.3" y="43.0" width="127.4" height="56.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="474.0" y="63.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Zustand store</text><text x="474.0" y="80.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">(localStorage)</text><rect x="410.3" y="1003.0" width="127.4" height="56.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="474.0" y="1023.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Zustand store</text><text x="474.0" y="1040.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">(localStorage)</text><line x1="624.3" y1="96.0" x2="624.3" y2="1006.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="567.7" y="51.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="624.3" y="71.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><rect x="567.7" y="1011.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="624.3" y="1031.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><line x1="994.0" y1="96.0" x2="994.0" y2="1006.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><path d="M939.0,57.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="994.0" cy="57.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="994.0" y="76.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><path d="M939.0,1017.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="994.0" cy="1017.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="994.0" y="1036.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><rect x="24.0" y="124.0" width="1031.0" height="29.0" rx="3" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1"/><text x="34.0" y="140.0" font-size="13" fill="#713F12" font-weight="normal" text-anchor="start"><tspan x="34.0" dy="0">Chạy khi đăng nhập hoặc tải lại trang lúc đã đăng nhập (CartSync, có userId)</tspan></text><text x="100.2" y="175.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">1. Khôi phục giỏ từ localStorage (brewlite-cart)</tspan></text><line x1="90.2" y1="184.0" x2="474.0" y2="184.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="100.2" y="246.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">2. PUT /cart {items, promoCode}</tspan></text><line x1="90.2" y1="255.0" x2="624.3" y2="255.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="100.2" y="313.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">3. GET /cart (Bearer token)</tspan></text><line x1="90.2" y1="322.0" x2="624.3" y2="322.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="634.3" y="350.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="634.3" dy="0">4. Đọc carts + cart_items + topping, khuyến mãi</tspan></text><line x1="624.3" y1="359.0" x2="994.0" y2="359.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="634.3" y="387.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="634.3" dy="0">5. giỏ đã lưu</tspan></text><line x1="994.0" y1="396.0" x2="624.3" y2="396.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.2" y="424.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">6. 200 {items, promoCode, promotion}</tspan></text><line x1="624.3" y1="433.0" x2="90.2" y2="433.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.2" y="495.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">7. Gộp giỏ khách + giỏ server (tối đa 99 ly/dòng)</tspan></text><line x1="90.2" y1="504.0" x2="474.0" y2="504.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="100.2" y="532.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">8. PUT /cart (giỏ đã gộp)</tspan></text><line x1="90.2" y1="541.0" x2="624.3" y2="541.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="100.2" y="599.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">9. Thay bằng giỏ trên server</tspan></text><line x1="90.2" y1="608.0" x2="474.0" y2="608.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><rect x="34.0" y="453.0" width="1011.0" height="175.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M34.0,453.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="41.0" y="467.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="41.0" dy="0">alt</tspan></text><text x="90.0" y="468.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="90.0" dy="0">[giỏ trên máy là giỏ khách (chưa có chủ)]</tspan></text><line x1="34.0" y1="559.0" x2="1045.0" y2="559.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="44.0" y="575.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="44.0" dy="0">[giỏ của tài khoản khác hoặc đã đồng bộ]</tspan></text><rect x="24.0" y="204.0" width="1031.0" height="438.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M24.0,204.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="31.0" y="218.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="31.0" dy="0">alt</tspan></text><text x="80.0" y="219.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="80.0" dy="0">[giỏ của chính user này còn thay đổi chưa lưu (dirty)]</tspan></text><line x1="24.0" y1="273.0" x2="1055.0" y2="273.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="34.0" y="289.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="34.0" dy="0">[cần lấy giỏ từ server]</tspan></text><line x1="24.0" y1="666.0" x2="1055.0" y2="666.0" stroke="#002C22" stroke-width="1" stroke-dasharray="2 3"/><rect x="456.5" y="655.0" width="166.0" height="22" rx="4" fill="#002C22"/><text x="539.5" y="670.0" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle"><tspan x="539.5" dy="0">Mỗi lần giỏ thay đổi</tspan></text><text x="100.2" y="700.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">10. subscribe: giỏ vừa đổi</tspan></text><line x1="474.0" y1="709.0" x2="90.2" y2="709.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="124.2" y="741.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="124.2" dy="0">11. Đánh dấu dirty, đợi 400 ms (debounce)</tspan></text><path d="M90.2,731.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="100.2" y="779.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">12. PUT /cart {items, promoCode}</tspan></text><line x1="90.2" y1="788.0" x2="624.3" y2="788.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="658.3" y="820.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="658.3" dy="0">13. Kiểm tra món tồn tại, gộp dòng trùng</tspan><tspan x="658.3" dy="17">(qty ≤ 99)</tspan></text><path d="M624.3,810.0 h26 v35.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="634.3" y="869.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="634.3" dy="0">14. Transaction: upsert cart,</tspan><tspan x="634.3" dy="17">xoá rồi ghi lại cart_items</tspan></text><line x1="624.3" y1="895.0" x2="994.0" y2="895.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="100.2" y="923.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">15. 200 giỏ đã lưu</tspan></text><line x1="624.3" y1="932.0" x2="90.2" y2="932.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="124.2" y="964.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="124.2" dy="0">16. Xoá cờ dirty</tspan></text><path d="M90.2,954.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/></svg>
