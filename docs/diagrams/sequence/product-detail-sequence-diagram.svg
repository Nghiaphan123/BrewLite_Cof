<svg xmlns="http://www.w3.org/2000/svg" width="1336" height="855" viewBox="0 0 1336 855" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#002C22"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#002C22" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="668.2" y="28" font-size="16" font-weight="bold" fill="#002C22" text-anchor="middle">BrewLite – Xem chi tiết món và thêm vào giỏ</text><line x1="90.0" y1="116.0" x2="90.0" y2="765.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.0" cy="55.0" r="7"/><line x1="90.0" y1="62.0" x2="90.0" y2="78.0"/><line x1="79.0" y1="67.0" x2="101.0" y2="67.0"/><line x1="90.0" y1="78.0" x2="81.0" y2="90.0"/><line x1="90.0" y1="78.0" x2="99.0" y2="90.0"/></g><text x="90.0" y="106.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Khách hàng</text><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.0" cy="774.0" r="7"/><line x1="90.0" y1="781.0" x2="90.0" y2="797.0"/><line x1="79.0" y1="786.0" x2="101.0" y2="786.0"/><line x1="90.0" y1="797.0" x2="81.0" y2="809.0"/><line x1="90.0" y1="797.0" x2="99.0" y2="809.0"/></g><text x="90.0" y="825.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Khách hàng</text><line x1="431.3" y1="116.0" x2="431.3" y2="765.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="371.2" y="61.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="431.3" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><rect x="371.2" y="780.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="431.3" y="800.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><line x1="800.8" y1="116.0" x2="800.8" y2="765.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="737.1" y="53.0" width="127.4" height="56.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="800.8" y="73.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Zustand store</text><text x="800.8" y="90.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">(localStorage)</text><rect x="737.1" y="772.0" width="127.4" height="56.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="800.8" y="792.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Zustand store</text><text x="800.8" y="809.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">(localStorage)</text><line x1="966.9" y1="116.0" x2="966.9" y2="765.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="910.3" y="61.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="966.9" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><rect x="910.3" y="780.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="966.9" y="800.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><line x1="1251.4" y1="116.0" x2="1251.4" y2="765.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><path d="M1196.4,67.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1251.4" cy="67.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1251.4" y="86.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><path d="M1196.4,786.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1251.4" cy="786.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1251.4" y="805.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><text x="100.0" y="152.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">1. Chọn một món trên menu</tspan></text><line x1="90.0" y1="161.0" x2="431.3" y2="161.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="441.3" y="189.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="441.3" dy="0">2. GET /products/:id</tspan></text><line x1="431.3" y1="198.0" x2="966.9" y2="198.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="441.3" y="260.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="441.3" dy="0">3. 404 PRODUCT_NOT_FOUND</tspan></text><line x1="966.9" y1="269.0" x2="431.3" y2="269.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="297.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">4. &quot;Không tìm thấy món&quot; + nút về Menu</tspan></text><line x1="431.3" y1="306.0" x2="90.0" y2="306.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="976.9" y="364.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="976.9" dy="0">5. Đọc món + các topping đang bán</tspan></text><line x1="966.9" y1="373.0" x2="1251.4" y2="373.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="976.9" y="401.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="976.9" dy="0">6. product, toppings (giá, tồn kho)</tspan></text><line x1="1251.4" y1="410.0" x2="966.9" y2="410.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="441.3" y="438.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="441.3" dy="0">7. 200 {product, sizes: S/M/L, toppings}</tspan></text><line x1="966.9" y1="447.0" x2="431.3" y2="447.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="475.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">8. Ảnh món, chọn size, topping, số lượng</tspan></text><line x1="431.3" y1="484.0" x2="90.0" y2="484.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="512.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">9. Chọn size M, thêm topping, số lượng 2</tspan></text><line x1="90.0" y1="521.0" x2="431.3" y2="521.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="465.3" y="553.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="465.3" dy="0">10. Tính giá: giá S + phụ thu size (M +5.000,</tspan><tspan x="465.3" dy="17">L +10.000) + topping; khoá topping hết hàng,</tspan><tspan x="465.3" dy="17">giới hạn số ly theo tồn kho</tspan></text><path d="M431.3,543.0 h26 v52.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="100.0" y="619.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">11. Bấm &quot;Thêm vào giỏ – &lt;tổng tiền&gt;&quot;</tspan></text><line x1="90.0" y1="628.0" x2="431.3" y2="628.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="441.3" y="656.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="441.3" dy="0">12. addItem(product, size, toppings, qty)</tspan><tspan x="441.3" dy="17">(trùng món + size + topping thì cộng dồn)</tspan></text><line x1="431.3" y1="682.0" x2="800.8" y2="682.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="100.0" y="710.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">13. Toast &quot;Đã thêm ... vào giỏ&quot;, sang /cart</tspan></text><line x1="431.3" y1="719.0" x2="90.0" y2="719.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><rect x="29.0" y="218.0" width="1283.4" height="521.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M29.0,218.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="36.0" y="232.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="36.0" dy="0">alt</tspan></text><text x="85.0" y="233.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="85.0" dy="0">[id không phải UUID hoặc không có món]</tspan></text><line x1="29.0" y1="324.0" x2="1312.4" y2="324.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="39.0" y="340.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="39.0" dy="0">[tìm thấy]</tspan></text></svg>
