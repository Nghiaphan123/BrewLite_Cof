<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="1480" viewBox="0 0 1376 1480" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#002C22"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#002C22" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="688.2" y="28" font-size="16" font-weight="bold" fill="#002C22" text-anchor="middle">BrewLite – Thanh toán đơn (idempotent)</text><line x1="90.0" y1="116.0" x2="90.0" y2="1390.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.0" cy="55.0" r="7"/><line x1="90.0" y1="62.0" x2="90.0" y2="78.0"/><line x1="79.0" y1="67.0" x2="101.0" y2="67.0"/><line x1="90.0" y1="78.0" x2="81.0" y2="90.0"/><line x1="90.0" y1="78.0" x2="99.0" y2="90.0"/></g><text x="90.0" y="106.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Khách hàng</text><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.0" cy="1399.0" r="7"/><line x1="90.0" y1="1406.0" x2="90.0" y2="1422.0"/><line x1="79.0" y1="1411.0" x2="101.0" y2="1411.0"/><line x1="90.0" y1="1422.0" x2="81.0" y2="1434.0"/><line x1="90.0" y1="1422.0" x2="99.0" y2="1434.0"/></g><text x="90.0" y="1450.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Khách hàng</text><line x1="459.7" y1="116.0" x2="459.7" y2="1390.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="399.6" y="61.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="459.7" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><rect x="399.6" y="1405.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="459.7" y="1425.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><line x1="893.3" y1="116.0" x2="893.3" y2="1390.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="836.7" y="61.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="893.3" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><rect x="836.7" y="1405.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="893.3" y="1425.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><line x1="1291.4" y1="116.0" x2="1291.4" y2="1390.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><path d="M1236.4,67.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1291.4" cy="67.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1291.4" y="86.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><path d="M1236.4,1411.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1291.4" cy="1411.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1291.4" y="1430.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><text x="100.0" y="152.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">1. Bấm &quot;Xác nhận thanh toán&quot;</tspan></text><line x1="90.0" y1="161.0" x2="459.7" y2="161.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="493.7" y="193.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="493.7" dy="0">2. Idempotency-Key = idem_&lt;orderId&gt;_&lt;method&gt;</tspan><tspan x="493.7" dy="17">(thêm _retryN sau mỗi lần thất bại)</tspan></text><path d="M459.7,183.0 h26 v35.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="469.7" y="242.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="469.7" dy="0">3. POST /payments + Idempotency-Key</tspan><tspan x="469.7" dy="17">{orderId, method: WALLET | CARD}</tspan></text><line x1="459.7" y1="268.0" x2="893.3" y2="268.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="469.7" y="330.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="469.7" dy="0">4. 400 IDEMPOTENCY_KEY_REQUIRED</tspan></text><line x1="893.3" y1="339.0" x2="459.7" y2="339.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="903.3" y="397.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="903.3" dy="0">5. Tìm payment theo (userId, idempotencyKey)</tspan></text><line x1="893.3" y1="406.0" x2="1291.4" y2="406.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="903.3" y="434.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="903.3" dy="0">6. payment cũ + requestHash</tspan></text><line x1="1291.4" y1="443.0" x2="893.3" y2="443.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="469.7" y="505.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="469.7" dy="0">7. 409 IDEMPOTENCY_CONFLICT</tspan></text><line x1="893.3" y1="514.0" x2="459.7" y2="514.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="469.7" y="572.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="469.7" dy="0">8. 200 kết quả cũ, replayed: true (không trừ tiền lần 2)</tspan></text><line x1="893.3" y1="581.0" x2="459.7" y2="581.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><rect x="39.0" y="463.0" width="1303.4" height="138.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M39.0,463.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="46.0" y="477.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="46.0" dy="0">alt</tspan></text><text x="95.0" y="478.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="95.0" dy="0">[hash khác (body khác)]</tspan></text><line x1="39.0" y1="532.0" x2="1342.4" y2="532.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="49.0" y="548.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="49.0" dy="0">[cùng hash]</tspan></text><text x="903.3" y="653.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="903.3" dy="0">9. BEGIN transaction; đọc order + items + topping</tspan></text><line x1="893.3" y1="662.0" x2="1291.4" y2="662.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="927.3" y="694.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="927.3" dy="0">10. Kiểm tra chủ đơn; PAYMENT_FAILED → PENDING;</tspan><tspan x="927.3" dy="17">assertTransition(PENDING → PAID | PAYMENT_FAILED)</tspan></text><path d="M893.3,684.0 h26 v35.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="903.3" y="811.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="903.3" dy="0">11. UPDATE products SET stock -= qty, version += 1</tspan><tspan x="903.3" dy="17">WHERE id = ? AND version = ? (optimistic lock)</tspan></text><line x1="893.3" y1="837.0" x2="1291.4" y2="837.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><rect x="49.0" y="769.0" width="1283.4" height="88.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M49.0,769.0 h54 v12 l-8,8 h-46 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="56.0" y="783.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="56.0" dy="0">loop</tspan></text><text x="113.0" y="784.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="113.0" dy="0">[mỗi dòng món]</tspan></text><text x="903.3" y="879.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="903.3" dy="0">12. UPDATE toppings SET stock -= số phần</tspan><tspan x="903.3" dy="17">WHERE stock ≥ số phần</tspan></text><line x1="893.3" y1="905.0" x2="1291.4" y2="905.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="469.7" y="967.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="469.7" dy="0">13. 409 OUT_OF_STOCK (rollback, đơn giữ PENDING)</tspan></text><line x1="893.3" y1="976.0" x2="459.7" y2="976.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><rect x="49.0" y="925.0" width="1283.4" height="71.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M49.0,925.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="56.0" y="939.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="56.0" dy="0">alt</tspan></text><text x="105.0" y="940.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="105.0" dy="0">[hết hàng hoặc bị người khác mua trước]</tspan></text><text x="903.3" y="1018.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="903.3" dy="0">14. Cộng điểm loyalty = floor(total / 1000)</tspan><tspan x="903.3" dy="17">+ ghi loyalty_transactions (EARN)</tspan></text><line x1="893.3" y1="1044.0" x2="1291.4" y2="1044.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="903.3" y="1072.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="903.3" dy="0">15. orders.status = PAID; INSERT payments (SUCCESS)</tspan></text><line x1="893.3" y1="1081.0" x2="1291.4" y2="1081.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="469.7" y="1109.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="469.7" dy="0">16. 200 {paymentId, status: PAID, amount}</tspan></text><line x1="893.3" y1="1118.0" x2="459.7" y2="1118.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="1146.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">17. Xoá giỏ, sang /orders/&lt;mã đơn&gt;/confirmation</tspan></text><line x1="459.7" y1="1155.0" x2="90.0" y2="1155.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="903.3" y="1213.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="903.3" dy="0">18. orders.status = PAYMENT_FAILED;</tspan><tspan x="903.3" dy="17">INSERT payments (FAILED)</tspan></text><line x1="893.3" y1="1239.0" x2="1291.4" y2="1239.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="469.7" y="1267.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="469.7" dy="0">19. 200 {status: PAYMENT_FAILED}</tspan></text><line x1="893.3" y1="1276.0" x2="459.7" y2="1276.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="1304.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">20. &quot;Thanh toán thất bại&quot;, giỏ giữ nguyên,</tspan><tspan x="100.0" dy="17">bấm lại để thử lại cùng đơn</tspan></text><line x1="459.7" y1="1330.0" x2="90.0" y2="1330.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><rect x="39.0" y="735.0" width="1303.4" height="615.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M39.0,735.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="46.0" y="749.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="46.0" dy="0">alt</tspan></text><text x="95.0" y="750.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="95.0" dy="0">[mock thanh toán thành công]</tspan></text><line x1="39.0" y1="1173.0" x2="1342.4" y2="1173.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="49.0" y="1189.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="49.0" dy="0">[mock thanh toán lỗi]</tspan></text><rect x="29.0" y="288.0" width="1323.4" height="1076.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M29.0,288.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="36.0" y="302.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="36.0" dy="0">alt</tspan></text><text x="85.0" y="303.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="85.0" dy="0">[thiếu Idempotency-Key]</tspan></text><line x1="29.0" y1="357.0" x2="1352.4" y2="357.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="39.0" y="373.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="39.0" dy="0">[key đã dùng (userId, key)]</tspan></text><line x1="29.0" y1="613.0" x2="1352.4" y2="613.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="39.0" y="629.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="39.0" dy="0">[key mới]</tspan></text></svg>
