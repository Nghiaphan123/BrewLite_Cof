<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="931" viewBox="0 0 1128 931" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#002C22"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#002C22" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="563.9" y="28" font-size="16" font-weight="bold" fill="#002C22" text-anchor="middle">BrewLite – Đổi mật khẩu</text><line x1="90.0" y1="116.0" x2="90.0" y2="841.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.0" cy="55.0" r="7"/><line x1="90.0" y1="62.0" x2="90.0" y2="78.0"/><line x1="79.0" y1="67.0" x2="101.0" y2="67.0"/><line x1="90.0" y1="78.0" x2="81.0" y2="90.0"/><line x1="90.0" y1="78.0" x2="99.0" y2="90.0"/></g><text x="90.0" y="106.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Khách hàng</text><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.0" cy="850.0" r="7"/><line x1="90.0" y1="857.0" x2="90.0" y2="873.0"/><line x1="79.0" y1="862.0" x2="101.0" y2="862.0"/><line x1="90.0" y1="873.0" x2="81.0" y2="885.0"/><line x1="90.0" y1="873.0" x2="99.0" y2="885.0"/></g><text x="90.0" y="901.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Khách hàng</text><line x1="488.1" y1="116.0" x2="488.1" y2="841.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="427.9" y="61.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="488.1" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><rect x="427.9" y="856.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="488.1" y="876.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><line x1="744.2" y1="116.0" x2="744.2" y2="841.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="687.6" y="61.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="744.2" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><rect x="687.6" y="856.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="744.2" y="876.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><line x1="1042.7" y1="116.0" x2="1042.7" y2="841.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><path d="M987.7,67.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1042.7" cy="67.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1042.7" y="86.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><path d="M987.7,862.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1042.7" cy="862.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1042.7" y="881.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><text x="100.0" y="152.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">1. Ở /profile nhập mật khẩu hiện tại, mật khẩu mới,</tspan><tspan x="100.0" dy="17">xác nhận; bấm &quot;Đổi mật khẩu&quot;</tspan></text><line x1="90.0" y1="178.0" x2="488.1" y2="178.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="100.0" y="240.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">2. &quot;Mật khẩu xác nhận không khớp&quot; (không gọi API)</tspan></text><line x1="488.1" y1="249.0" x2="90.0" y2="249.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="498.1" y="307.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="498.1" dy="0">3. PATCH /auth/password</tspan><tspan x="498.1" dy="17">{currentPassword, newPassword}</tspan></text><line x1="488.1" y1="333.0" x2="744.2" y2="333.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="778.2" y="365.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="778.2" dy="0">4. JwtAuthGuard + ChangePasswordDto</tspan><tspan x="778.2" dy="17">(mật khẩu mới có chữ và số)</tspan></text><path d="M744.2,355.0 h26 v35.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="754.2" y="414.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="754.2" dy="0">5. Đọc user theo req.user.id</tspan></text><line x1="744.2" y1="423.0" x2="1042.7" y2="423.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="754.2" y="451.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="754.2" dy="0">6. user (passwordHash)</tspan></text><line x1="1042.7" y1="460.0" x2="744.2" y2="460.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="498.1" y="522.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="498.1" dy="0">7. 401 CURRENT_PASSWORD_INVALID</tspan></text><line x1="744.2" y1="531.0" x2="488.1" y2="531.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="498.1" y="589.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="498.1" dy="0">8. 400 PASSWORD_UNCHANGED</tspan></text><line x1="744.2" y1="598.0" x2="488.1" y2="598.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="778.2" y="660.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="778.2" dy="0">9. bcrypt.hash(newPassword)</tspan></text><path d="M744.2,650.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="754.2" y="698.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="754.2" dy="0">10. UPDATE users SET passwordHash</tspan></text><line x1="744.2" y1="707.0" x2="1042.7" y2="707.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="498.1" y="735.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="498.1" dy="0">11. 200 {message}</tspan></text><line x1="744.2" y1="744.0" x2="488.1" y2="744.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="772.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">12. &quot;Đổi mật khẩu thành công.&quot;</tspan></text><line x1="488.1" y1="781.0" x2="90.0" y2="781.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><rect x="39.0" y="480.0" width="1054.7" height="321.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M39.0,480.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="46.0" y="494.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="46.0" dy="0">alt</tspan></text><text x="95.0" y="495.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="95.0" dy="0">[mật khẩu hiện tại sai]</tspan></text><line x1="39.0" y1="549.0" x2="1093.7" y2="549.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="49.0" y="565.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="49.0" dy="0">[mật khẩu mới trùng mật khẩu cũ]</tspan></text><line x1="39.0" y1="616.0" x2="1093.7" y2="616.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/>