<svg xmlns="http://www.w3.org/2000/svg" width="1213" height="1006" viewBox="0 0 1213 1006" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#002C22"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#002C22" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="606.5" y="28" font-size="16" font-weight="bold" fill="#002C22" text-anchor="middle">BrewLite – Lịch sử và chi tiết đơn hàng</text><line x1="90.0" y1="116.0" x2="90.0" y2="916.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.0" cy="55.0" r="7"/><line x1="90.0" y1="62.0" x2="90.0" y2="78.0"/><line x1="79.0" y1="67.0" x2="101.0" y2="67.0"/><line x1="90.0" y1="78.0" x2="81.0" y2="90.0"/><line x1="90.0" y1="78.0" x2="99.0" y2="90.0"/></g><text x="90.0" y="106.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Khách hàng</text><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.0" cy="925.0" r="7"/><line x1="90.0" y1="932.0" x2="90.0" y2="948.0"/><line x1="79.0" y1="937.0" x2="101.0" y2="937.0"/><line x1="90.0" y1="948.0" x2="81.0" y2="960.0"/><line x1="90.0" y1="948.0" x2="99.0" y2="960.0"/></g><text x="90.0" y="976.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Khách hàng</text><line x1="473.9" y1="116.0" x2="473.9" y2="916.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="413.8" y="61.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="473.9" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><rect x="413.8" y="931.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="473.9" y="951.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><line x1="779.5" y1="116.0" x2="779.5" y2="916.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="722.9" y="61.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="779.5" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><rect x="722.9" y="931.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="779.5" y="951.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><line x1="1127.9" y1="116.0" x2="1127.9" y2="916.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><path d="M1072.9,67.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1127.9" cy="67.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1127.9" y="86.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><path d="M1072.9,937.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1127.9" cy="937.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1127.9" y="956.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><text x="100.0" y="152.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">1. Mở /orders</tspan></text><line x1="90.0" y1="161.0" x2="473.9" y2="161.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="507.9" y="193.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="507.9" dy="0">2. Hiện skeleton danh sách</tspan></text><path d="M473.9,183.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="483.9" y="231.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="483.9" dy="0">3. GET /orders/me (Bearer token)</tspan></text><line x1="473.9" y1="240.0" x2="779.5" y2="240.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="813.5" y="272.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="813.5" dy="0">4. JwtAuthGuard → req.user.id</tspan></text><path d="M779.5,262.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="789.5" y="310.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="789.5" dy="0">5. SELECT orders WHERE userId = ?</tspan><tspan x="789.5" dy="17">ORDER BY createdAt DESC (kèm items, topping)</tspan></text><line x1="779.5" y1="336.0" x2="1127.9" y2="336.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="789.5" y="364.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="789.5" dy="0">6. danh sách đơn</tspan></text><line x1="1127.9" y1="373.0" x2="779.5" y2="373.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="483.9" y="401.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="483.9" dy="0">7. 200 {items, total}</tspan></text><line x1="779.5" y1="410.0" x2="473.9" y2="410.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="472.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">8. Trạng thái trống + nút &quot;Xem menu&quot;</tspan></text><line x1="473.9" y1="481.0" x2="90.0" y2="481.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="539.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">9. Danh sách: mã đơn, ngày, trạng thái, tổng tiền</tspan></text><line x1="473.9" y1="548.0" x2="90.0" y2="548.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="576.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">10. Bấm một đơn → /orders/&lt;id&gt;</tspan></text><line x1="90.0" y1="585.0" x2="473.9" y2="585.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="483.9" y="613.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="483.9" dy="0">11. GET /orders/me</tspan></text><line x1="473.9" y1="622.0" x2="779.5" y2="622.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="483.9" y="650.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="483.9" dy="0">12. 200 {items}</tspan></text><line x1="779.5" y1="659.0" x2="473.9" y2="659.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="507.9" y="691.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="507.9" dy="0">13. Tìm đơn theo id (hoặc mã BL-...)</tspan></text><path d="M473.9,681.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="100.0" y="763.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">14. &quot;Không tìm thấy đơn hàng&quot;</tspan></text><line x1="473.9" y1="772.0" x2="90.0" y2="772.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="830.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">15. Chi tiết: món, size, topping, giảm giá,</tspan><tspan x="100.0" dy="17">tổng tiền, trạng thái lấy từ server</tspan></text><line x1="473.9" y1="856.0" x2="90.0" y2="856.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><rect x="39.0" y="721.0" width="1139.9" height="155.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M39.0,721.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="46.0" y="735.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="46.0" dy="0">alt</tspan></text><text x="95.0" y="736.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="95.0" dy="0">[không thấy đơn]</tspan></text><line x1="39.0" y1="790.0" x2="1178.9" y2="790.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="49.0" y="806.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="49.0" dy="0">[thấy đơn]</tspan></text><rect x="29.0" y="430.0" width="1159.9" height="460.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M29.0,430.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="36.0" y="444.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="36.0" dy="0">alt</tspan></text><text x="85.0" y="445.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="85.0" dy="0">[chưa có đơn nào]</tspan></text><line x1="29.0" y1="499.0" x2="1188.9" y2="499.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="39.0" y="515.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="39.0" dy="0">[có đơn]</tspan></text></svg>
