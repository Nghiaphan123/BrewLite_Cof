<svg xmlns="http://www.w3.org/2000/svg" width="1349" height="844" viewBox="0 0 1349 844" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#002C22"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#002C22" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="674.4" y="28" font-size="16" font-weight="bold" fill="#002C22" text-anchor="middle">BrewLite – Admin khoá / mở khoá tài khoản</text><line x1="90.2" y1="116.0" x2="90.2" y2="754.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.2" cy="55.0" r="7"/><line x1="90.2" y1="62.0" x2="90.2" y2="78.0"/><line x1="79.2" y1="67.0" x2="101.2" y2="67.0"/><line x1="90.2" y1="78.0" x2="81.2" y2="90.0"/><line x1="90.2" y1="78.0" x2="99.2" y2="90.0"/></g><text x="90.2" y="106.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Quản trị viên</text><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.2" cy="763.0" r="7"/><line x1="90.2" y1="770.0" x2="90.2" y2="786.0"/><line x1="79.2" y1="775.0" x2="101.2" y2="775.0"/><line x1="90.2" y1="786.0" x2="81.2" y2="798.0"/><line x1="90.2" y1="786.0" x2="99.2" y2="798.0"/></g><text x="90.2" y="814.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Quản trị viên</text><line x1="360.4" y1="116.0" x2="360.4" y2="754.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="300.3" y="61.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="360.4" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><rect x="300.3" y="769.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="360.4" y="789.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><line x1="730.1" y1="116.0" x2="730.1" y2="754.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="673.5" y="61.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="730.1" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><rect x="673.5" y="769.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="730.1" y="789.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><line x1="1113.8" y1="116.0" x2="1113.8" y2="754.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><path d="M1058.8,67.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1113.8" cy="67.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1113.8" y="86.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><path d="M1058.8,775.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1113.8" cy="775.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1113.8" y="794.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><line x1="1263.8" y1="116.0" x2="1263.8" y2="754.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="1263.8" cy="55.0" r="7"/><line x1="1263.8" y1="62.0" x2="1263.8" y2="78.0"/><line x1="1252.8" y1="67.0" x2="1274.8" y2="67.0"/><line x1="1263.8" y1="78.0" x2="1254.8" y2="90.0"/><line x1="1263.8" y1="78.0" x2="1272.8" y2="90.0"/></g><text x="1263.8" y="106.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Khách hàng</text><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="1263.8" cy="763.0" r="7"/><line x1="1263.8" y1="770.0" x2="1263.8" y2="786.0"/><line x1="1252.8" y1="775.0" x2="1274.8" y2="775.0"/><line x1="1263.8" y1="786.0" x2="1254.8" y2="798.0"/><line x1="1263.8" y1="786.0" x2="1272.8" y2="798.0"/></g><text x="1263.8" y="814.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Khách hàng</text><text x="100.2" y="152.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">1. Tab Người dùng, bấm &quot;Khoá&quot;</tspan></text><line x1="90.2" y1="161.0" x2="360.4" y2="161.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="370.4" y="189.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="370.4" dy="0">2. PATCH /admin/users/:id/block {blocked: true}</tspan></text><line x1="360.4" y1="198.0" x2="730.1" y2="198.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="764.1" y="230.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="764.1" dy="0">3. JwtAuthGuard + AdminGuard</tspan></text><path d="M730.1,220.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="740.1" y="268.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="740.1" dy="0">4. Tìm user theo id</tspan></text><line x1="730.1" y1="277.0" x2="1113.8" y2="277.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="370.4" y="339.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="370.4" dy="0">5. 404 USER_NOT_FOUND</tspan></text><line x1="730.1" y1="348.0" x2="360.4" y2="348.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="370.4" y="406.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="370.4" dy="0">6. 409 CANNOT_BLOCK_ADMIN</tspan></text><line x1="730.1" y1="415.0" x2="360.4" y2="415.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="740.1" y="473.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="740.1" dy="0">7. UPDATE users SET blocked = true</tspan></text><line x1="730.1" y1="482.0" x2="1113.8" y2="482.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="370.4" y="510.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="370.4" dy="0">8. 200 user (blocked)</tspan></text><line x1="730.1" y1="519.0" x2="360.4" y2="519.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.2" y="547.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">9. Dòng người dùng hiện &quot;Đã khoá&quot;</tspan></text><line x1="360.4" y1="556.0" x2="90.2" y2="556.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><rect x="24.0" y="297.0" width="1300.8" height="279.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M24.0,297.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="31.0" y="311.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="31.0" dy="0">alt</tspan></text><text x="80.0" y="312.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="80.0" dy="0">[không có user]</tspan></text><line x1="24.0" y1="366.0" x2="1324.8" y2="366.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="34.0" y="382.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="34.0" dy="0">[user là ADMIN]</tspan></text><line x1="24.0" y1="433.0" x2="1324.8" y2="433.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="34.0" y="449.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="34.0" dy="0">[khách hàng]</tspan></text><line x1="24.0" y1="600.0" x2="1324.8" y2="600.0" stroke="#002C22" stroke-width="1" stroke-dasharray="2 3"/><rect x="552.4" y="589.0" width="244.1" height="22" rx="4" fill="#002C22"/><text x="674.4" y="604.0" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle"><tspan x="674.4" dy="0">Khách bị khoá dùng lại token cũ</tspan></text><text x="740.1" y="634.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="740.1" dy="0">10. Bất kỳ request có Bearer token (vd GET /orders/me)</tspan></text><line x1="1263.8" y1="643.0" x2="730.1" y2="643.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="764.1" y="675.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="764.1" dy="0">11. JwtAuthGuard: validateUser → blocked = true</tspan></text><path d="M730.1,665.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="740.1" y="713.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="740.1" dy="0">12. 403 ACCOUNT_BLOCKED (token cũ hết tác dụng ngay)</tspan></text><line x1="730.1" y1="722.0" x2="1263.8" y2="722.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/></svg>
