<svg xmlns="http://www.w3.org/2000/svg" width="1206" height="1099" viewBox="0 0 1206 1099" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#002C22"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#002C22" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="602.9" y="28" font-size="16" font-weight="bold" fill="#002C22" text-anchor="middle">BrewLite – Đăng ký tài khoản</text><line x1="90.0" y1="116.0" x2="90.0" y2="1009.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.0" cy="55.0" r="7"/><line x1="90.0" y1="62.0" x2="90.0" y2="78.0"/><line x1="79.0" y1="67.0" x2="101.0" y2="67.0"/><line x1="90.0" y1="78.0" x2="81.0" y2="90.0"/><line x1="90.0" y1="78.0" x2="99.0" y2="90.0"/></g><text x="90.0" y="106.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Khách hàng</text><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.0" cy="1018.0" r="7"/><line x1="90.0" y1="1025.0" x2="90.0" y2="1041.0"/><line x1="79.0" y1="1030.0" x2="101.0" y2="1030.0"/><line x1="90.0" y1="1041.0" x2="81.0" y2="1053.0"/><line x1="90.0" y1="1041.0" x2="99.0" y2="1053.0"/></g><text x="90.0" y="1069.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Khách hàng</text><line x1="466.8" y1="116.0" x2="466.8" y2="1009.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="406.6" y="61.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="466.8" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><rect x="406.6" y="1024.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="466.8" y="1044.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><line x1="758.2" y1="116.0" x2="758.2" y2="1009.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="701.6" y="61.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="758.2" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><rect x="701.6" y="1024.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="758.2" y="1044.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><line x1="1120.8" y1="116.0" x2="1120.8" y2="1009.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><path d="M1065.8,67.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1120.8" cy="67.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1120.8" y="86.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><path d="M1065.8,1030.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1120.8" cy="1030.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1120.8" y="1049.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><text x="100.0" y="152.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">1. Nhập họ tên, email, mật khẩu</tspan><tspan x="100.0" dy="17">bấm &quot;Đăng ký&quot;</tspan></text><line x1="90.0" y1="178.0" x2="466.8" y2="178.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="476.8" y="206.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="476.8" dy="0">2. POST /auth/register</tspan><tspan x="476.8" dy="17">{name, email, password}</tspan></text><line x1="466.8" y1="232.0" x2="758.2" y2="232.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="792.2" y="264.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="792.2" dy="0">3. ValidationPipe kiểm tra RegisterDto</tspan><tspan x="792.2" dy="17">(tên 2–80 ký tự, email hợp lệ,</tspan><tspan x="792.2" dy="17">mật khẩu ≥ 8 ký tự có chữ và số)</tspan></text><path d="M758.2,254.0 h26 v52.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="476.8" y="364.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="476.8" dy="0">4. 400 Bad Request</tspan></text><line x1="758.2" y1="373.0" x2="466.8" y2="373.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="401.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">5. Hiện lỗi tiếng Việt dưới form</tspan></text><line x1="466.8" y1="410.0" x2="90.0" y2="410.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="768.2" y="468.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="768.2" dy="0">6. Tìm user theo email (chữ thường)</tspan></text><line x1="758.2" y1="477.0" x2="1120.8" y2="477.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="768.2" y="505.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="768.2" dy="0">7. user | null</tspan></text><line x1="1120.8" y1="514.0" x2="758.2" y2="514.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="476.8" y="576.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="476.8" dy="0">8. 409 EMAIL_TAKEN</tspan></text><line x1="758.2" y1="585.0" x2="466.8" y2="585.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="613.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">9. &quot;Email này đã được đăng ký.&quot;</tspan></text><line x1="466.8" y1="622.0" x2="90.0" y2="622.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="792.2" y="684.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="792.2" dy="0">10. bcrypt.hash(password)</tspan></text><path d="M758.2,674.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="768.2" y="722.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="768.2" dy="0">11. INSERT users</tspan><tspan x="768.2" dy="17">(name, email, passwordHash, loyaltyPoints = 0)</tspan></text><line x1="758.2" y1="748.0" x2="1120.8" y2="748.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="768.2" y="776.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="768.2" dy="0">12. user mới</tspan></text><line x1="1120.8" y1="785.0" x2="758.2" y2="785.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="476.8" y="813.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="476.8" dy="0">13. 201 {user} (không trả token)</tspan></text><line x1="758.2" y1="822.0" x2="466.8" y2="822.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="850.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">14. &quot;Đăng ký tài khoản thành công&quot; + loading</tspan></text><line x1="466.8" y1="859.0" x2="90.0" y2="859.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="500.8" y="891.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="500.8" dy="0">15. Chờ 1,5 giây, chuyển sang form</tspan><tspan x="500.8" dy="17">Đăng nhập (giữ sẵn email)</tspan></text><path d="M466.8,881.0 h26 v35.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="100.0" y="940.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">16. &quot;Tài khoản đã sẵn sàng. Vui lòng đăng nhập.&quot;</tspan></text><line x1="466.8" y1="949.0" x2="90.0" y2="949.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><rect x="39.0" y="534.0" width="1132.8" height="435.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M39.0,534.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="46.0" y="548.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="46.0" dy="0">alt</tspan></text><text x="95.0" y="549.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="95.0" dy="0">[email đã tồn tại]</tspan></text><line x1="39.0" y1="640.0" x2="1171.8" y2="640.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="49.0" y="656.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="49.0" dy="0">[email mới]</tspan></text><rect x="29.0" y="322.0" width="1152.8" height="661.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M29.0,322.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="36.0" y="336.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="36.0" dy="0">alt</tspan></text><text x="85.0" y="337.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="85.0" dy="0">[dữ liệu không hợp lệ]</tspan></text><line x1="29.0" y1="428.0" x2="1181.8" y2="428.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="39.0" y="444.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="39.0" dy="0">[dữ liệu hợp lệ]</tspan></text></svg>
