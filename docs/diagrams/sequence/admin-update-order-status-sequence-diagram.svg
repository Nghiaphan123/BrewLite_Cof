<svg xmlns="http://www.w3.org/2000/svg" width="1263" height="1133" viewBox="0 0 1263 1133" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#002C22"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#002C22" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="631.4" y="28" font-size="16" font-weight="bold" fill="#002C22" text-anchor="middle">BrewLite – Admin cập nhật trạng thái đơn</text><line x1="90.2" y1="116.0" x2="90.2" y2="1043.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.2" cy="55.0" r="7"/><line x1="90.2" y1="62.0" x2="90.2" y2="78.0"/><line x1="79.2" y1="67.0" x2="101.2" y2="67.0"/><line x1="90.2" y1="78.0" x2="81.2" y2="90.0"/><line x1="90.2" y1="78.0" x2="99.2" y2="90.0"/></g><text x="90.2" y="106.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Quản trị viên</text><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.2" cy="1052.0" r="7"/><line x1="90.2" y1="1059.0" x2="90.2" y2="1075.0"/><line x1="79.2" y1="1064.0" x2="101.2" y2="1064.0"/><line x1="90.2" y1="1075.0" x2="81.2" y2="1087.0"/><line x1="90.2" y1="1075.0" x2="99.2" y2="1087.0"/></g><text x="90.2" y="1103.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Quản trị viên</text><line x1="474.0" y1="116.0" x2="474.0" y2="1043.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="413.9" y="61.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="474.0" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><rect x="413.9" y="1058.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="474.0" y="1078.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><line x1="808.2" y1="116.0" x2="808.2" y2="1043.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="751.6" y="61.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="808.2" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><rect x="751.6" y="1058.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="808.2" y="1078.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><line x1="1177.8" y1="116.0" x2="1177.8" y2="1043.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><path d="M1122.8,67.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1177.8" cy="67.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1177.8" y="86.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><path d="M1122.8,1064.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1177.8" cy="1064.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1177.8" y="1083.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><text x="100.2" y="152.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">1. Mở /admin, tab Đơn hàng</tspan></text><line x1="90.2" y1="161.0" x2="474.0" y2="161.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="484.0" y="189.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="484.0" dy="0">2. GET /admin/orders</tspan></text><line x1="474.0" y1="198.0" x2="808.2" y2="198.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="842.2" y="230.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="842.2" dy="0">3. JwtAuthGuard + AdminGuard (role = ADMIN)</tspan></text><path d="M808.2,220.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="484.0" y="302.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="484.0" dy="0">4. 403 FORBIDDEN</tspan></text><line x1="808.2" y1="311.0" x2="474.0" y2="311.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="484.0" y="369.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="484.0" dy="0">5. 200 danh sách đơn</tspan></text><line x1="808.2" y1="378.0" x2="474.0" y2="378.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.2" y="406.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">6. Mỗi đơn chỉ hiện các trạng thái kế tiếp hợp lệ</tspan><tspan x="100.2" dy="17">(nextManualStatuses)</tspan></text><line x1="474.0" y1="432.0" x2="90.2" y2="432.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.2" y="460.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">7. Chọn trạng thái mới (vd PAID → PREPARING)</tspan></text><line x1="90.2" y1="469.0" x2="474.0" y2="469.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="484.0" y="497.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="484.0" dy="0">8. PATCH /admin/orders/:id/status {status}</tspan></text><line x1="474.0" y1="506.0" x2="808.2" y2="506.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="818.2" y="534.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="818.2" dy="0">9. BEGIN transaction; đọc order</tspan></text><line x1="808.2" y1="543.0" x2="1177.8" y2="543.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="842.2" y="575.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="842.2" dy="0">10. assertManualTransition(from, to):</tspan><tspan x="842.2" dy="17">chặn PENDING / PAID / PAYMENT_FAILED bằng tay</tspan></text><path d="M808.2,565.0 h26 v35.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="484.0" y="658.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="484.0" dy="0">11. 409 INVALID_STATE_TRANSITION</tspan></text><line x1="808.2" y1="667.0" x2="474.0" y2="667.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.2" y="695.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">12. &quot;Không thể thực hiện thao tác với</tspan><tspan x="100.2" dy="17">trạng thái hiện tại của đơn hàng.&quot;</tspan></text><line x1="474.0" y1="721.0" x2="90.2" y2="721.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="818.2" y="779.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="818.2" dy="0">13. Trả lại tồn kho món + topping,</tspan><tspan x="818.2" dy="17">trừ lại điểm loyalty; status = CANCELLED</tspan></text><line x1="808.2" y1="805.0" x2="1177.8" y2="805.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="484.0" y="833.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="484.0" dy="0">14. 200 {id, code, status}</tspan></text><line x1="808.2" y1="842.0" x2="474.0" y2="842.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="818.2" y="900.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="818.2" dy="0">15. UPDATE orders SET status; COMMIT</tspan></text><line x1="808.2" y1="909.0" x2="1177.8" y2="909.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="484.0" y="937.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="484.0" dy="0">16. 200 {id, code, status, updatedAt}</tspan></text><line x1="808.2" y1="946.0" x2="474.0" y2="946.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.2" y="974.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">17. Cập nhật dòng đơn trong bảng</tspan></text><line x1="474.0" y1="983.0" x2="90.2" y2="983.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><rect x="34.0" y="616.0" width="1194.8" height="387.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M34.0,616.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="41.0" y="630.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="41.0" dy="0">alt</tspan></text><text x="90.0" y="631.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="90.0" dy="0">[chuyển trạng thái sai]</tspan></text><line x1="34.0" y1="739.0" x2="1228.8" y2="739.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="44.0" y="755.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="44.0" dy="0">[PAID → CANCELLED]</tspan></text><line x1="34.0" y1="860.0" x2="1228.8" y2="860.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="44.0" y="876.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="44.0" dy="0">[hợp lệ (PAID → PREPARING → READY → COMPLETED)]</tspan></text><rect x="24.0" y="260.0" width="1214.8" height="757.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M24.0,260.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="31.0" y="274.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="31.0" dy="0">alt</tspan></text><text x="80.0" y="275.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="80.0" dy="0">[không phải admin]</tspan></text><line x1="24.0" y1="329.0" x2="1238.8" y2="329.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="34.0" y="345.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="34.0" dy="0">[admin]</tspan></text></svg>
