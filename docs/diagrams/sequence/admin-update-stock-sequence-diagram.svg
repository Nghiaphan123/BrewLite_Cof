<svg xmlns="http://www.w3.org/2000/svg" width="1206" height="849" viewBox="0 0 1206 849" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#002C22"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#002C22" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="603.0" y="28" font-size="16" font-weight="bold" fill="#002C22" text-anchor="middle">BrewLite – Admin sửa tồn kho món / topping</text><line x1="90.2" y1="116.0" x2="90.2" y2="759.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.2" cy="55.0" r="7"/><line x1="90.2" y1="62.0" x2="90.2" y2="78.0"/><line x1="79.2" y1="67.0" x2="101.2" y2="67.0"/><line x1="90.2" y1="78.0" x2="81.2" y2="90.0"/><line x1="90.2" y1="78.0" x2="99.2" y2="90.0"/></g><text x="90.2" y="106.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Quản trị viên</text><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.2" cy="768.0" r="7"/><line x1="90.2" y1="775.0" x2="90.2" y2="791.0"/><line x1="79.2" y1="780.0" x2="101.2" y2="780.0"/><line x1="90.2" y1="791.0" x2="81.2" y2="803.0"/><line x1="90.2" y1="791.0" x2="99.2" y2="803.0"/></g><text x="90.2" y="819.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Quản trị viên</text><line x1="438.5" y1="116.0" x2="438.5" y2="759.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="378.4" y="61.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="438.5" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><rect x="378.4" y="774.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="438.5" y="794.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><line x1="794.0" y1="116.0" x2="794.0" y2="759.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="737.4" y="61.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="794.0" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><rect x="737.4" y="774.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="794.0" y="794.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><line x1="1120.9" y1="116.0" x2="1120.9" y2="759.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><path d="M1065.9,67.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1120.9" cy="67.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1120.9" y="86.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><path d="M1065.9,780.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1120.9" cy="780.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1120.9" y="799.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><text x="100.2" y="152.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">1. Tab Tồn kho món (hoặc Topping)</tspan></text><line x1="90.2" y1="161.0" x2="438.5" y2="161.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="448.5" y="189.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="448.5" dy="0">2. GET /admin/products | GET /admin/toppings</tspan></text><line x1="438.5" y1="198.0" x2="794.0" y2="198.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="828.0" y="230.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="828.0" dy="0">3. JwtAuthGuard + AdminGuard</tspan></text><path d="M794.0,220.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="448.5" y="268.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="448.5" dy="0">4. 200 danh sách kèm tồn kho</tspan></text><line x1="794.0" y1="277.0" x2="438.5" y2="277.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.2" y="305.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">5. StockTable: mức tồn (hết / sắp hết / còn)</tspan></text><line x1="438.5" y1="314.0" x2="90.2" y2="314.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.2" y="342.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">6. Nhập số tồn kho mới, bấm Lưu</tspan></text><line x1="90.2" y1="351.0" x2="438.5" y2="351.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="448.5" y="379.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="448.5" dy="0">7. PATCH /admin/products/:id/stock {stock}</tspan><tspan x="448.5" dy="17">(hoặc /admin/toppings/:id/stock)</tspan></text><line x1="438.5" y1="405.0" x2="794.0" y2="405.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="828.0" y="437.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="828.0" dy="0">8. Validate DTO: stock là số nguyên ≥ 0</tspan></text><path d="M794.0,427.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="804.0" y="475.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="804.0" dy="0">9. Tìm món / topping theo id</tspan></text><line x1="794.0" y1="484.0" x2="1120.9" y2="484.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="448.5" y="546.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="448.5" dy="0">10. 404 PRODUCT_NOT_FOUND | TOPPING_NOT_FOUND</tspan></text><line x1="794.0" y1="555.0" x2="438.5" y2="555.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="804.0" y="613.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="804.0" dy="0">11. UPDATE stock (món: tăng version để</tspan><tspan x="804.0" dy="17">giữ optimistic lock)</tspan></text><line x1="794.0" y1="639.0" x2="1120.9" y2="639.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="448.5" y="667.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="448.5" dy="0">12. 200 bản ghi đã cập nhật</tspan></text><line x1="794.0" y1="676.0" x2="438.5" y2="676.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.2" y="704.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.2" dy="0">13. Thông báo đã lưu, cập nhật mức tồn</tspan></text><line x1="438.5" y1="713.0" x2="90.2" y2="713.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><rect x="24.0" y="504.0" width="1157.9" height="229.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M24.0,504.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="31.0" y="518.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="31.0" dy="0">alt</tspan></text><text x="80.0" y="519.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="80.0" dy="0">[không tồn tại]</tspan></text><line x1="24.0" y1="573.0" x2="1181.9" y2="573.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="34.0" y="589.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="34.0" dy="0">[tồn tại]</tspan></text></svg>
