"/><text x="381.6" y="713.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><line x1="609.1" y1="116.0" x2="609.1" y2="678.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="552.5" y="61.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="609.1" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><rect x="552.5" y="693.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="609.1" y="713.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><line x1="943.3" y1="116.0" x2="943.3" y2="678.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><path d="M888.3,67.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="943.3" cy="67.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="943.3" y="86.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><path d="M888.3,699.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="943.3" cy="699.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="943.3" y="718.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><text x="100.0" y="152.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">1. Mở trang Menu (/menu)</tspan></text><line x1="90.0" y1="161.0" x2="381.6" y2="161.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="415.6" y="193.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="415.6" dy="0">2. Hiện skeleton đang tải</tspan></text><path d="M381.6,183.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="391.6" y="231.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="391.6" dy="0">3. GET /products</tspan></text><line x1="381.6" y1="240.0" x2="609.1" y2="240.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="619.1" y="268.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="619.1" dy="0">4. SELECT id, name, price, imageUrl, stock</tspan><tspan x="619.1" dy="17">FROM products ORDER BY name</tspan></text><line x1="609.1" y1="294.0" x2="943.3" y2="294.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="619.1" y="322.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="619.1" dy="0">5. danh sách món</tspan></text><line x1="943.3" y1="331.0" x2="609.1" y2="331.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="643.1" y="363.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="643.1" dy="0">6. Đổi imageUrl thành URL tuyệt đối</tspan></text><path d="M609.1,353.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="391.6" y="401.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="391.6" dy="0">7. 200 {items, total}</tspan></text><line x1="609.1" y1="410.0" x2="381.6" y2="410.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="472.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">8. Thông báo lỗi + nút &quot;Thử lại&quot;</tspan></text><line x1="381.6" y1="481.0" x2="90.0" y2="481.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="539.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">9. Trạng thái trống: chưa có món</tspan></text><line x1="381.6" y1="548.0" x2="90.0" y2="548.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="606.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">10. Lưới ProductCard (ảnh, tên, giá,</tspan><tspan x="100.0" dy="17">nhãn &quot;Hết hàng&quot; khi stock = 0)</tspan></text><line x1="381.6" y1="632.0" x2="90.0" y2="632.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><rect x="29.0" y="430.0" width="975.3" height="222.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M29.0,430.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="36.0" y="444.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="36.0" dy="0">alt</tspan></text><text x="85.0" y="445.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="85.0" dy="0">[lỗi mạng / lỗi máy chủ / sai định dạng]</tspan></text><line x1="29.0" y1="499.0" x2="1004.3" y2="499.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="39.0" y="515.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="39.0" dy="0">[items rỗng]</tspan></text><line x1="29.0" y1="566.0" x2="1004.3" y2="566.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="39.0" y="582.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="39.0" dy="0">[có dữ liệu]</tspan></text></svg>
