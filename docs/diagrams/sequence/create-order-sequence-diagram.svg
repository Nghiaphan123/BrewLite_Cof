<svg xmlns="http://www.w3.org/2000/svg" width="1355" height="1207" viewBox="0 0 1355 1207" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#002C22"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#002C22" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="677.5" y="28" font-size="16" font-weight="bold" fill="#002C22" text-anchor="middle">BrewLite – Tạo đơn hàng khi thanh toán</text><line x1="90.0" y1="116.0" x2="90.0" y2="1117.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.0" cy="55.0" r="7"/><line x1="90.0" y1="62.0" x2="90.0" y2="78.0"/><line x1="79.0" y1="67.0" x2="101.0" y2="67.0"/><line x1="90.0" y1="78.0" x2="81.0" y2="90.0"/><line x1="90.0" y1="78.0" x2="99.0" y2="90.0"/></g><text x="90.0" y="106.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Khách hàng</text><g stroke="#002C22" stroke-width="1.6" fill="none"><circle cx="90.0" cy="1126.0" r="7"/><line x1="90.0" y1="1133.0" x2="90.0" y2="1149.0"/><line x1="79.0" y1="1138.0" x2="101.0" y2="1138.0"/><line x1="90.0" y1="1149.0" x2="81.0" y2="1161.0"/><line x1="90.0" y1="1149.0" x2="99.0" y2="1161.0"/></g><text x="90.0" y="1177.0" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Khách hàng</text><line x1="459.7" y1="116.0" x2="459.7" y2="1117.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="399.6" y="61.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="459.7" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><rect x="399.6" y="1132.5" width="120.3" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="459.7" y="1152.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">Web (Next.js)</text><line x1="872.0" y1="116.0" x2="872.0" y2="1117.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><rect x="815.4" y="61.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="872.0" y="81.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><rect x="815.4" y="1132.5" width="113.2" height="39.0" rx="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="872.0" y="1152.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">API (NestJS)</text><line x1="1269.9" y1="116.0" x2="1269.9" y2="1117.0" stroke="#A8A29E" stroke-width="1" stroke-dasharray="5 5"/><path d="M1214.9,67.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1269.9" cy="67.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1269.9" y="86.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><path d="M1214.9,1138.5 v33.0 a55.0,6 0 0 0 110.0,0 v-33.0" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><ellipse cx="1269.9" cy="1138.5" rx="55.0" ry="6" fill="#E7F0EC" stroke="#002C22" stroke-width="1.4"/><text x="1269.9" y="1157.5" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">PostgreSQL</text><text x="100.0" y="152.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">1. Ở /checkout chọn phương thức, bấm xác nhận</tspan></text><line x1="90.0" y1="161.0" x2="459.7" y2="161.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="469.7" y="189.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="469.7" dy="0">2. POST /orders (Bearer token)</tspan><tspan x="469.7" dy="17">{items[productId, size, qty, toppingIds], promoCode?}</tspan></text><line x1="459.7" y1="215.0" x2="872.0" y2="215.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="906.0" y="247.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="906.0" dy="0">3. JwtAuthGuard: kiểm tra token,</tspan><tspan x="906.0" dy="17">user còn tồn tại và chưa bị khoá</tspan></text><path d="M872.0,237.0 h26 v35.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="469.7" y="330.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="469.7" dy="0">4. 401 AUTH_REQUIRED | AUTH_INVALID | AUTH_EXPIRED</tspan></text><line x1="872.0" y1="339.0" x2="459.7" y2="339.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="367.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">5. &quot;Phiên đăng nhập hết hạn&quot; + nút Đăng nhập</tspan><tspan x="100.0" dy="17">(giỏ hàng vẫn giữ nguyên)</tspan></text><line x1="459.7" y1="393.0" x2="90.0" y2="393.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="906.0" y="455.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="906.0" dy="0">6. ValidationPipe: ≥ 1 dòng, size S/M/L, qty 1–99</tspan></text><path d="M872.0,445.0 h26 v24.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="882.0" y="493.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="882.0" dy="0">7. BEGIN transaction</tspan></text><line x1="872.0" y1="502.0" x2="1269.9" y2="502.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="882.0" y="530.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="882.0" dy="0">8. Đọc giá món và topping</tspan></text><line x1="872.0" y1="539.0" x2="1269.9" y2="539.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="882.0" y="567.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="882.0" dy="0">9. products, toppings</tspan></text><line x1="1269.9" y1="576.0" x2="872.0" y2="576.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="469.7" y="638.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="469.7" dy="0">10. 404 PRODUCT_NOT_FOUND | 400 TOPPING_*</tspan></text><line x1="872.0" y1="647.0" x2="459.7" y2="647.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="906.0" y="709.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="906.0" dy="0">11. Server tự tính giá: giá S + phụ thu size</tspan><tspan x="906.0" dy="17">+ topping (không tin giá từ client)</tspan></text><path d="M872.0,699.0 h26 v35.0 h-24" fill="none" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="882.0" y="792.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="882.0" dy="0">12. Kiểm tra mã, tăng usedCount</tspan></text><line x1="872.0" y1="801.0" x2="1269.9" y2="801.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><rect x="49.0" y="750.0" width="1261.9" height="71.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M49.0,750.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="56.0" y="764.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="56.0" dy="0">opt</tspan></text><text x="105.0" y="765.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="105.0" dy="0">[có promoCode]</tspan></text><text x="882.0" y="843.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="882.0" dy="0">13. nextval(&#x27;order_code_seq&#x27;) → mã BL-YYYY-NNNN</tspan></text><line x1="872.0" y1="852.0" x2="1269.9" y2="852.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="882.0" y="880.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="882.0" dy="0">14. INSERT orders (PENDING) + order_items</tspan><tspan x="882.0" dy="17">+ order_item_toppings; COMMIT</tspan></text><line x1="872.0" y1="906.0" x2="1269.9" y2="906.0" stroke="#002C22" stroke-width="1.4" marker-end="url(#solid)"/><text x="469.7" y="934.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="469.7" dy="0">15. 201 {id, code, status: PENDING, subtotal,</tspan><tspan x="469.7" dy="17">discountAmount, total, items}</tspan></text><line x1="872.0" y1="960.0" x2="459.7" y2="960.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="100.0" y="988.0" font-size="13" fill="#1C1917" font-weight="normal" text-anchor="start"><tspan x="100.0" dy="0">16. QR: hiện mã QR của đơn (lưu sessionStorage)</tspan><tspan x="100.0" dy="17">Ví/Thẻ: chuyển ngay sang bước thanh toán</tspan></text><line x1="459.7" y1="1014.0" x2="90.0" y2="1014.0" stroke="#002C22" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><rect x="39.0" y="596.0" width="1281.9" height="438.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M39.0,596.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="46.0" y="610.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="46.0" dy="0">alt</tspan></text><text x="95.0" y="611.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="95.0" dy="0">[món không tồn tại / topping không có hoặc ngừng bán]</tspan></text><line x1="39.0" y1="665.0" x2="1320.9" y2="665.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="49.0" y="681.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="49.0" dy="0">[hợp lệ]</tspan></text><rect x="29.0" y="288.0" width="1301.9" height="760.0" fill="none" stroke="#78716C" stroke-width="1"/><path d="M29.0,288.0 h46 v12 l-8,8 h-38 z" fill="#F5F5F4" stroke="#78716C" stroke-width="1"/><text x="36.0" y="302.0" font-size="12" fill="#1C1917" font-weight="bold" text-anchor="start"><tspan x="36.0" dy="0">alt</tspan></text><text x="85.0" y="303.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="85.0" dy="0">[token thiếu / sai / hết hạn]</tspan></text><line x1="29.0" y1="411.0" x2="1330.9" y2="411.0" stroke="#78716C" stroke-width="1" stroke-dasharray="5 4"/><text x="39.0" y="427.0" font-size="12" fill="#57534E" font-weight="bold" text-anchor="start"><tspan x="39.0" dy="0">[token hợp lệ]</tspan></text><rect x="29.0" y="1062.0" width="1301.9" height="29.0" rx="3" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1"/><text x="39.0" y="1078.0" font-size="13" fill="#713F12" font-weight="normal" text-anchor="start"><tspan x="39.0" dy="0">Tồn kho chưa bị trừ ở bước này; chỉ trừ khi thanh toán thành công (ADR 0004)</tspan></text></svg>
